<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <h2 class="text-center text-white">Ingrese el nombre</h2>
    <input type="text" id="pokemonInput" placeholder="Ejemplo: Pikachu">
    <button onclick="buscarPokemon()">Buscar pokemon</button>
    <div id="resultado"></div>
</body>
<script>
    async function buscarPokemon() {        
    const pokemonInput = document.getElementById('pokemonInput');
    const nombrePokemon = pokemonInput.value.
    toLowerCase().
    trim();
    document.getElementById("resultado").innerHTML =`
    <p> Buscando información</p> `;

    try { 
        const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/`+nombrePokemon) 
        const pokemon = await respuesta.json();
        document.getElementById("resultado").innerHTML = `
        <h2>${pokemon.name.toUpperCase()}</h2> 
        <h2>${pokemon.id}</h2>
        <h2>${pokemon.order}</h2>
        <img src="${pokemon.sprites.front_default}">
        `;
        
    }
    catch (error) {
        console.error("Error al buscar el pokemon:", error);
        document.getElementById("resultado").innerHTML = "<p>Error al buscar el pokemon.</p>";
    }
}
</script>
</html>
