<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD de Personas</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="contenedor">

        <header>
            <h1>CRUD de Personas</h1>
            <p>Gestión de personas con Firebase Firestore</p>
        </header>

        <section class="formulario">

            <h2 id="tituloFormulario">Registrar persona</h2>

            <form id="personaForm">

                <input type="hidden" id="personaId">

                <div class="grupo">
                    <label for="nombres">Nombres</label>
                    <input
                        type="text"
                        id="nombres"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="apellidos">Apellidos</label>
                    <input
                        type="text"
                        id="apellidos"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="telefono">Teléfono</label>
                    <input
                        type="tel"
                        id="telefono"
                    >
                </div>

                <div class="grupo">
                    <label for="correo">Correo</label>
                    <input
                        type="email"
                        id="correo"
                    >
                </div>

                <div class="botones">

                    <button
                        type="submit"
                        id="btnGuardar"
                    >
                        Guardar
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="cancelar"
                        hidden
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <section class="lista">

            <div class="cabecera-lista">
                <h2>Personas registradas</h2>

                <span id="contador">
                    0 personas
                </span>
            </div>

            <div id="mensaje">
                Cargando personas...
            </div>

            <div
                id="tablaContainer"
                class="tabla-container"
            >

                <table>

                    <thead>

                        <tr>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tablaPersonas"></tbody>

                </table>

            </div>

        </section>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
