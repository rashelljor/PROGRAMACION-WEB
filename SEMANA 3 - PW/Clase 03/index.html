<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 3</title>
    <script src="function.js"></script>
    <script src="concatenar.js"></script>
    <script src="registrar.js"></script>
    <script src="comida.js"></script>
    <script src="aumentar.js"></script>
</head>
<body style="grid-template-columns: 3fr; background-color: #000000; color: #ffffff;">
    <section>
        <h1>Semana 3</h1>
        <h2>Ejercicio 1</h2>
        <p>Número 1</p>
        <input type="number" id="num1" step="0.5">
        <p>Número 2</p>
        <input type="number" id="num2" step="0.5">
        <p>Resultado: </p>
        <p id="resultado"></p>
        <button onclick="suma()">Calcular</button>
    </section> 

    <section>
        <h2>Ejercicio 2</h2>
        <p>Nombres</p>
        <input type="text" id="nombre">
        <p>Apellidos</p>
        <input type="text" id="apellido">   
        <p>Resultado: </p>
        <p id="concatenar"></p>
        <button onclick="concatenar()">Nombre completo</button>
    </section>

    <section>
        <h2>Ejercicio 3</h2>
        <p>Nombre completo</p>
        <input type="text" id="nombrecompleto">
        <p>¿Vivo?</p>
        <input type="checkbox" id="vivo">   
        <p>Estado: </p>
        <p id="estado"></p>
        <button onclick="registrar()">Estado</button>
    </section>

    <section>
        <h2>Ejercicio 4</h2>
        <p>Valor</p>
        <input type="range" id="valor" min="0" max="4" step="1">
        <p>Comida: </p>
        <p id="comida"></p>
        <button onclick="comida()">Registrar</button>
    </section>

    <section>
        <h2>Ejercicio 5</h2>
        <p>Cantidad de tickets</p>
        <button onclick="aumentar()">+1</button>
        <p>Usted debe pagar: </p>
        <p id="aumentado"></p>
    </section>
</body>
</html>
